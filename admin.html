<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — Rohtak Public School</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">RPS</span>
      <span class="brand-text">
        <span class="name">Rohtak Public School</span>
        <span class="place">Rohtak, Haryana</span>
      </span>
    </a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="notices.html">Notices</a>
      <a href="admissions.html">Admissions</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
      <a href="admin.html" aria-current="page">Staff Login</a>
    </nav>
  </div>
</header>

<!-- Logged out: login box -->
<div id="login-view" class="login-box">
  <h3>Staff login</h3>
  <p class="form-note">For school staff managing notices and enquiries.</p>
  <form class="stack" id="login-form">
    <div class="field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required>
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" required>
    </div>
    <button class="btn btn-primary" type="submit">Log in</button>
    <div class="form-status" id="login-status"></div>
  </form>
</div>

<!-- Logged in: dashboard -->
<div id="admin-view" class="admin-shell" style="display:none;">
  <aside class="admin-side">
    <h3>Admin dashboard</h3>
    <p id="admin-email"></p>
    <button class="btn btn-ghost" id="logout-btn" style="margin-top:16px;">Log out</button>
  </aside>
  <main class="admin-main">
    <span class="eyebrow">Post a notice</span>
    <h2>New notice</h2>
    <form class="stack" id="notice-form">
      <div class="field">
        <label for="title">Title *</label>
        <input type="text" id="title" required>
      </div>
      <div class="field">
        <label for="summary">Summary *</label>
        <textarea id="summary" required></textarea>
      </div>
      <button class="btn btn-primary" type="submit">Publish notice</button>
      <div class="form-status" id="notice-status"></div>
    </form>

    <h2 style="margin-top:44px;">Published notices</h2>
    <div id="notice-admin-list"><div class="empty-state">Loading&hellip;</div></div>

    <h2 style="margin-top:44px;">Admission enquiries</h2>
    <div id="enquiry-list"><div class="empty-state">Loading&hellip;</div></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
